<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Revolver">
  <defs>
    <linearGradient id="revolver-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D97757" />
      <stop offset="1" stop-color="#C15F3C" />
    </linearGradient>
  </defs>
  <!-- 陶土橙渐变底：与 web/src/index.css 的 primary/primary-deep 同一组色 -->
  <rect width="32" height="32" rx="7" fill="url(#revolver-g)" />
  <!-- 弹仓外圈 -->
  <circle cx="16" cy="16" r="11.3" fill="none" stroke="#FFFFFF" stroke-width="2.6" />
  <!-- 6 个弹巢：半径 6.8 的圆上每 60° 一个，尺寸按 16px tab 下的可辨识度定 -->
  <g fill="#FFFFFF">
    <circle cx="16" cy="9.2" r="2.6" />
    <circle cx="21.89" cy="12.6" r="2.6" />
    <circle cx="21.89" cy="19.4" r="2.6" />
    <circle cx="16" cy="22.8" r="2.6" />
    <circle cx="10.11" cy="19.4" r="2.6" />
    <circle cx="10.11" cy="12.6" r="2.6" />
  </g>
  <!-- 中心转轴 -->
  <circle cx="16" cy="16" r="1.5" fill="#FFFFFF" />
</svg>
