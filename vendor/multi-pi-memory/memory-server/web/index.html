<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pi 记忆中心</title>
<style>
:root {
  --bg: #0d1117; --panel: #161b22; --border: #21262d;
  --text: #e6edf3; --dim: #8b949e;
  --accent: #58a6ff; --green: #7ee787; --orange: #ffa657; --red: #f85149; --purple: #d2a8ff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px;
}
h1 { font-size: 20px; margin-bottom: 4px; }
.sub { color: var(--dim); font-size: 13px; margin-bottom: 20px; }
.stats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
.stat {
  background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
  padding: 10px 16px; min-width: 110px;
}
.stat .n { font-size: 22px; font-weight: 700; }
.stat .k { font-size: 12px; color: var(--dim); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
@media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
.card h2 { font-size: 14px; margin-bottom: 12px; color: var(--accent); }
.card h2 .hint { font-weight: 400; font-size: 11px; color: var(--dim); margin-left: 8px; }
.item {
  background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 10px; margin-bottom: 6px; font-size: 13px; display: flex; gap: 8px; align-items: flex-start;
}
.item .cat { flex-shrink: 0; font-size: 10px; padding: 2px 6px; border-radius: 4px; margin-top: 1px; }
.cat.fact { background: #1f6feb44; color: var(--accent); }
.cat.preference { background: #7ee78744; color: var(--green); }
.cat.goal { background: #ffa65744; color: var(--orange); }
.cat.decision { background: #f8514944; color: var(--red); }
.cat.knowledge { background: #d2a8ff44; color: var(--purple); }
.item .body { flex: 1; word-break: break-word; line-height: 1.5; }
.item .meta { font-size: 11px; color: var(--dim); margin-top: 4px; display: flex; gap: 10px; flex-wrap: wrap; }
.item .score { color: var(--green); }
.item .del { border: none; background: none; color: var(--dim); cursor: pointer; font-size: 15px; padding: 0 4px; }
.item .del:hover { color: var(--red); }
.row { display: flex; gap: 8px; margin-bottom: 10px; }
input, textarea, select, button {
  font-family: inherit; font-size: 13px; border-radius: 8px;
}
input, textarea, select {
  background: var(--bg); color: var(--text); border: 1px solid var(--border); padding: 8px 10px; outline: none;
}
input:focus, textarea:focus { border-color: var(--accent); }
input[type=text] { flex: 1; }
textarea { width: 100%; resize: vertical; min-height: 80px; }
button {
  background: var(--accent); color: #0d1117; border: none; padding: 8px 14px;
  cursor: pointer; font-weight: 600;
}
button:hover { filter: brightness(1.1); }
button.ghost { background: var(--bg); color: var(--text); border: 1px solid var(--border); font-weight: 400; }
.filter { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.chip { padding: 4px 10px; border-radius: 20px; font-size: 12px; cursor: pointer;
  border: 1px solid var(--border); background: var(--bg); color: var(--dim); }
.chip.on { background: var(--accent); color: #0d1117; border-color: var(--accent); font-weight: 600; }
.log-item { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
.log-item .q { font-size: 12px; color: var(--dim); margin-bottom: 8px; }
.log-item .q b { color: var(--text); font-size: 12px; }
.log-item .none { font-size: 12px; color: var(--dim); font-style: italic; padding: 4px 0; }
.grp { margin-bottom: 6px; }
.grp .gt { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 3px; }
.hit { display: flex; gap: 8px; align-items: baseline; font-size: 12px; padding: 3px 0; border-bottom: 1px solid #21262d55; }
.hit:last-child { border-bottom: none; }
.hit .bar { flex-shrink: 0; width: 46px; height: 4px; background: var(--border); border-radius: 2px; position: relative; margin-top: 5px; }
.hit .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: var(--green); }
.hit .bar i.pass { background: var(--green); }
.hit .bar i.marg { background: var(--orange); }
.hit .sc { flex-shrink: 0; width: 34px; font-size: 11px; color: var(--green); text-align: right; }
.hit .sc.marg { color: var(--orange); }
.hit .tx { flex: 1; color: var(--text); line-height: 1.45; }
.hit .thr { flex-shrink: 0; font-size: 10px; color: var(--dim); }
.cat.evidence { background: #79c0ff33; color: #79c0ff; }
.cat.thesis { background: #d2a8ff33; color: var(--purple); }
.cat .cat { flex-shrink: 0; font-size: 10px; padding: 2px 5px; border-radius: 4px; margin-right: 6px; }
.empty { color: var(--dim); font-size: 13px; padding: 12px 0; text-align: center; }
.params label { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); margin-right: 14px; }
.params input { width: 90px; }
.params { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 10px; }

/* 标签页导航 */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 16px; flex-wrap: wrap; }
.tab {
  background: none; border: none; border-bottom: 2px solid transparent; color: var(--dim);
  padding: 9px 16px; cursor: pointer; font-size: 13px; font-weight: 400; border-radius: 0;
  display: flex; align-items: center; gap: 6px;
}
.tab:hover { color: var(--text); background: #ffffff08; }
.tab.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.tab .n { font-size: 11px; color: var(--dim); background: var(--bg); border-radius: 10px; padding: 1px 7px; }
.tab.on .n { color: var(--accent); }
.pane { display: none; }
.pane.on { display: block; }
/* 列表内滚, 避免整页越拉越长 */
.scroll { max-height: 62vh; overflow-y: auto; padding-right: 4px; }
.scroll::-webkit-scrollbar { width: 8px; }
.scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
.scroll::-webkit-scrollbar-thumb:hover { background: #30363d; }
.toast-zone { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 99; }
.toast { background: var(--panel); border: 1px solid var(--border); padding: 8px 16px; border-radius: 8px; font-size: 13px; margin-top: 6px; }
.dropzone {
  border: 2px dashed var(--border); border-radius: 10px; padding: 16px;
  text-align: center; color: var(--dim); transition: all .2s; cursor: pointer;
}
.dropzone.drag { border-color: var(--accent); background: #58a6ff11; }
.dropzone .dz-hint { font-size: 13px; margin-bottom: 8px; }
.file-queue { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.file-queue .fq-item {
  background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  padding: 6px 10px; font-size: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.file-queue .fq-item.ok { border-color: #7ee78766; color: var(--green); }
.file-queue .fq-item.err { border-color: #f8514966; color: var(--red); }
.file-queue .fq-name { flex: 1; word-break: break-all; color: var(--text); }
.file-queue .fq-remove { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 14px; padding: 0 4px; }
.file-queue .fq-remove:hover { color: var(--red); }
</style>
</head>
<body>
<h1>pi 记忆中心</h1>
<div class="sub">跨会话记忆 + 知识库 · 全局共享 · 向量检索</div>

<div class="stats" id="stats"></div>

<!-- 标签页导航 -->
<div class="tabs" id="tabs">
  <button class="tab on" data-pane="pane-log" onclick="showTab('pane-log')">
    注入日志 <span class="n" id="nLog">0</span></button>
  <button class="tab" data-pane="pane-mem" onclick="showTab('pane-mem')">
    跨会话记忆 <span class="n" id="nMem">0</span></button>
  <button class="tab" data-pane="pane-kb" onclick="showTab('pane-kb')">
    知识库 <span class="n" id="nKb">0</span></button>
  <button class="tab" data-pane="pane-cfg" onclick="showTab('pane-cfg')">检索参数</button>
</div>

<!-- ① 注入日志 -->
<div class="pane on" id="pane-log">
  <div class="card">
    <h2>注入日志 <span class="hint">每次注入带了什么记忆、分数与门槛对比（橙色=刚过线）</span></h2>
    <div class="scroll" id="logList"></div>
  </div>
</div>

<!-- ② 跳会话记忆 -->
<div class="pane" id="pane-mem">
  <div class="card">
    <h2>跨会话记忆 <span class="hint">对话自动抽取，也可手动添加</span></h2>
    <div class="row">
      <select id="memCat">
        <option value="fact">事实</option>
        <option value="preference">偏好</option>
        <option value="goal">目标</option>
        <option value="decision">决定</option>
      </select>
      <input type="text" id="memContent" placeholder="手动添加一条记忆...">
      <button onclick="addMemory()">添加</button>
    </div>
    <div class="filter" id="memFilter"></div>
    <div class="scroll" id="memList"></div>
  </div>
</div>

<!-- ③ 知识库 -->
<div class="pane" id="pane-kb">
  <div class="card">
    <h2>知识库 <span class="hint">上传或粘贴文档 → 切块向量化 → agent 可检索引用</span></h2>
    <div id="dropZone" class="dropzone">
      <div class="dz-hint">拖拽 md/txt 文件到此处</div>
      <button type="button" class="ghost" onclick="$('fileInput').click()">选择文件</button>
      <input type="file" id="fileInput" accept=".md,.markdown,.txt" multiple hidden>
      <div id="fileQueue" class="file-queue"></div>
    </div>
    <div style="margin:12px 0 8px;text-align:center;color:var(--dim);font-size:12px">— 或粘贴文本 —</div>
    <div class="row">
      <input type="text" id="kbTitle" placeholder="文档标题">
    </div>
    <textarea id="kbText" placeholder="粘贴文档内容（支持 md/txt），将自动切块入库..."></textarea>
    <div style="margin-top:8px;display:flex;justify-content:flex-end">
      <button onclick="importKB()">导入粘贴文本</button>
    </div>
    <div class="scroll" id="kbList" style="margin-top:10px"></div>
  </div>
</div>

<!-- ④ 检索参数 -->
<div class="pane" id="pane-cfg">
  <div class="card">
    <h2>检索参数 <span class="hint">调整后即时生效</span></h2>
    <div class="params" id="params"></div>
    <h2 style="margin-top:18px">分层召回门槛 <span class="hint">每类自己的及格线</span></h2>
    <div id="thresholds"></div>
  </div>
</div>

<div class="toast-zone" id="toastZone"></div>

<script>
const $ = id => document.getElementById(id);
const CATS = { fact: '事实', preference: '偏好', goal: '目标', decision: '决定', knowledge: '知识' };
let state = { filter: 'all', memories: [], logs: [] };

async function api(path, opts = {}) {
  const r = await fetch(path, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
  });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || '请求失败');
  return d;
}

function toast(text) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = text;
  $('toastZone').appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

/* 标签页切换: 用 localStorage 记住上次看的那页, 刷新不跳回 */
const TABS = ['pane-log', 'pane-mem', 'pane-kb', 'pane-cfg'];
function showTab(id) {
  TABS.forEach(t => {
    const pane = $(t);
    if (pane) pane.classList.toggle('on', t === id);
  });
  document.querySelectorAll('.tab').forEach(b =>
    b.classList.toggle('on', b.dataset.pane === id));
  try { localStorage.setItem('piMemTab', id); } catch (e) {}
}
(function restoreTab() {
  let last = null;
  try { last = localStorage.getItem('piMemTab'); } catch (e) {}
  if (last && $(last)) showTab(last);
})();

async function loadAll() {
  await Promise.all([loadStatus(), loadMemories(), loadLogs(), loadParams(), loadKB()]);
}

/* 状态 */
async function loadStatus() {
  const d = await api('/api/status');
  const s = d.stats;
  $('stats').innerHTML = `
    <div class="stat"><div class="n">${s.total}</div><div class="k">记忆总数</div></div>
    <div class="stat"><div class="n">${s.by_source.knowledge || 0}</div><div class="k">知识库块</div></div>
    <div class="stat"><div class="n">${d.embedding.model}</div><div class="k">embedding 模型</div></div>
    <div class="stat"><div class="n">${d.embedding.dim}</div><div class="k">维度</div></div>
    <div class="stat"><div class="n">${(s.by_source.conversation || 0) + (s.by_source.manual || 0)}</div><div class="k">对话记忆</div></div>`;

  /* 分层召回门槛表: 让「哪类容易进来」一目了然 */
  const eff = (d.retrieval_min && d.retrieval_min.effective) || {};
  const GN = { preference: '① 档案', goal: '① 档案', decision: '① 档案', fact: '① 档案',
               evidence: '② 认知库', thesis: '② 认知库', knowledge: '③ 知识库' };
  const CN = CATS;
  const rows = Object.entries(eff).sort((a, b) => a[1] - b[1]).map(([c, v]) => `
    <div class="hit">
      <span class="cat ${c}">${CN[c] || c}</span>
      <span class="bar"><i class="pass" style="width:${v * 100}%"></i></span>
      <span class="sc">${v.toFixed(2)}</span>
      <span class="tx" style="color:var(--dim)">${GN[c] || ''}　门槛越低越容易带进来</span>
    </div>`).join('');
  if ($('thresholds')) $('thresholds').innerHTML = rows || '<div class="empty">暂无</div>';
}

/* 记忆 */
async function loadMemories() {
  const d = await api('/api/memories?limit=300');
  state.memories = d.memories;
  renderMemories();
  renderMemFilter();
}
function renderMemFilter() {
  const cats = [['all', '全部'], ['conversation', '对话'], ['manual', '手动'], ...Object.entries(CATS)];
  $('memFilter').innerHTML = cats.map(([k, v]) =>
    `<span class="chip ${state.filter === k ? 'on' : ''}" onclick="setFilter('${k}')">${v}</span>`).join('');
}
function setFilter(k) { state.filter = k; renderMemories(); }
function renderMemories() {
  const list = state.memories.filter(m => state.filter === 'all' ? true : m.source === state.filter);
  if ($('nMem')) $('nMem').textContent = list.length;
  $('memList').innerHTML = list.length ? list.map(m => `
    <div class="item">
      <span class="cat ${m.category}">${CATS[m.category] || m.category}</span>
      <div class="body">${esc(m.content)}
        <div class="meta"><span>${m.source === 'knowledge' ? '知识库' : m.source === 'manual' ? '手动' : '对话'}</span>
        ${m.project ? `<span>${esc(m.project)}</span>` : ''}</div>
      </div>
      <button class="del" onclick="delMemory('${m.id}')">×</button>
    </div>`).join('') : '<div class="empty">暂无记忆。对话会自动抽取，或手动添加。</div>';
}
async function addMemory() {
  const content = $('memContent').value.trim();
  if (!content) return;
  try {
    await api('/api/memories', { method: 'POST', body: JSON.stringify({ content, category: $('memCat').value }) });
    $('memContent').value = '';
    toast('已添加并向量化');
    loadAll();
  } catch (e) { toast(e.message); }
}
async function delMemory(id) {
  await api('/api/memories/' + id, { method: 'DELETE' });
  loadAll();
}

/* 知识库 */
async function importKB() {
  const text = $('kbText').value.trim();
  const title = $('kbTitle').value.trim();
  if (!text) { toast('请粘贴文档内容'); return; }
  try {
    const d = await api('/api/knowledge', { method: 'POST', body: JSON.stringify({ text, title }) });
    toast(`已导入 ${d.added} 块 / 共 ${d.chunks} 块`);
    $('kbText').value = '';
    loadAll();
  } catch (e) { toast(e.message); }
}

/* 文件上传 */
let fileQueue = [];  // {name, size, status: 'pending'|'ok'|'err', msg}
function renderFileQueue() {
  $('fileQueue').innerHTML = fileQueue.length ? fileQueue.map((f, i) => `
    <div class="fq-item ${f.status === 'ok' ? 'ok' : f.status === 'err' ? 'err' : ''}">
      <span class="fq-name">${esc(f.name)}</span>
      <span>${f.status === 'ok' ? `✓ 导入 ${f.msg}` : f.status === 'err' ? `✕ ${f.msg}` : '上传中...'}</span>
      <button class="fq-remove" onclick="fileQueue.splice(${i},1);renderFileQueue()">×</button>
    </div>`).join('') : '';
}
async function uploadFiles(files) {
  for (const file of files) {
    if (!/\.(md|markdown|txt)$/i.test(file.name)) {
      fileQueue.push({ name: file.name, status: 'err', msg: '仅支持 md/txt' });
      renderFileQueue();
      continue;
    }
    fileQueue.push({ name: file.name, status: 'pending' });
    renderFileQueue();
    const fd = new FormData();
    fd.append('file', file);
    try {
      const r = await fetch('/api/knowledge/upload', { method: 'POST', body: fd });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || '上传失败');
      const item = fileQueue[fileQueue.length - 1];
      item.status = 'ok'; item.msg = `${d.added}/${d.chunks} 块`;
    } catch (e) {
      const item = fileQueue[fileQueue.length - 1];
      item.status = 'err'; item.msg = e.message;
    }
    renderFileQueue();
  }
  if (files.length) loadAll();
}
function initDropzone() {
  const dz = $('dropZone');
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('drag'));
  dz.addEventListener('drop', e => {
    e.preventDefault(); dz.classList.remove('drag');
    uploadFiles([...e.dataTransfer.files]);
  });
  $('fileInput').addEventListener('change', e => {
    uploadFiles([...e.target.files]);
    e.target.value = '';
  });
}
async function loadKB() {
  const d = await api('/api/knowledge');
  const docs = d.documents || [];
  if ($('nKb')) $('nKb').textContent = docs.reduce((a, x) => a + (x.chunks || 0), 0);
  $('kbList').innerHTML = docs.length
    ? docs.map(doc => `<div class="item"><div class="body"><b>${esc(doc.title)}</b><div class="meta">${doc.chunks} 块</div></div></div>`).join('')
    : '<div class="empty">知识库为空。导入文档后 agent 可检索引用。</div>';
}

/* 注入日志: 按分数分组展示, 便于判断门槛高低 */
async function loadLogs() {
  const d = await api('/api/logs');
  const logs = d.logs || [];
  if ($('nLog')) $('nLog').textContent = logs.length;
  if (!logs.length) { $('logList').innerHTML = '<div class="empty">暂无注入记录。</div>'; return; }
  const CN = {preference:'偏好',goal:'目标',decision:'决定',fact:'事实',
              knowledge:'知识',thesis:'论点',evidence:'论据'};
  const GN = {profile:'① 你的档案',content:'② 认知库',knowledge:'③ 知识库'};
  $('logList').innerHTML = logs.map(l => {
    const byG = {};
    (l.hits||[]).forEach(h => { const g = h.group || '?'; (byG[g] = byG[g]||[]).push(h); });
    const body = Object.keys(byG).length ? Object.entries(byG).map(([g, hs]) => `
      <div class="grp">
        <div class="gt">${GN[g]||g}</div>
        ${hs.map(h => {
          const s = h.score||0, t = h.threshold||0;
          const marg = s - t < 0.05;              /* 刚过线 → 橙色警示 */
          const w = Math.min(100, Math.max(4, s*100));
          const label = (h.category && CN[h.category]) ? CN[h.category] : (h.category||'?');
          return `<div class="hit" title="分数 ${s.toFixed(3)} / 门槛 ${t.toFixed(2)}">
            <span class="cat ${h.category}">${label}</span>
            <span class="bar"><i class="${marg?'marg':'pass'}" style="width:${w}%"></i></span>
            <span class="sc ${marg?'marg':''}">${s.toFixed(2)}</span>
            <span class="tx">${esc(h.content)}</span>
            <span class="thr">门${t.toFixed(2)}</span>
          </div>`; }).join('')}
      </div>`).join('') : '<div class="none">未召回任何记忆（全部门槛未过）</div>';
    return `<div class="log-item">
      <div class="q">${l.time} · 共 ${l.count} 条 · 问 “${esc(l.query)}”</div>
      ${body}
    </div>`;
  }).join('');
}

/* 参数 */
async function loadParams() {
  const d = await api('/api/status');
  const r = d.retrieval;
  $('params').innerHTML = `
    <label>top_n <input type="number" id="p_top_n" value="${r.top_n}"></label>
    <label>阈值 <input type="number" step="0.05" id="p_min_score" value="${r.min_score}"></label>
    <label>断崖比 <input type="number" step="0.1" id="p_cliff" value="${r.cliff_ratio}"></label>
    <button onclick="saveParams()">保存</button>`;
}
async function saveParams() {
  const body = {
    top_n: +$('p_top_n').value,
    min_score: +$('p_min_score').value,
    cliff_ratio: +$('p_cliff').value,
  };
  await api('/api/config', { method: 'POST', body: JSON.stringify(body) });
  toast('参数已保存并生效');
  loadAll();
}

function esc(s) {
  return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

$('memContent').addEventListener('keydown', e => { if (e.key === 'Enter') addMemory(); });
initDropzone();
loadAll();
</script>
</body>
</html>
