# pi 记忆中心 —— 配置文件
#
# 首次使用建议运行交互式向导：./setup.py
# 它会自动探测本机可用的推理后端（LM Studio / Ollama / 云端 API）并生成此文件。
#
# provider 取值：
#   lmstudio — 本地 LM Studio（零成本、隐私，带自愈守护）
#   openai   — 任意 OpenAI 兼容端点（OpenAI / DeepSeek / 硅基流动 / Ollama / vLLM ...）

server:
  host: 127.0.0.1
  port: 8970

# ============ 向量化模型 ============
# 注意：dim（维度）由模型决定，换模型后必须运行 `python reembed.py` 重建索引，
#       否则旧向量与新模型不兼容，检索会出错（服务启动时会检测并告警）。
embedding:
  provider: lmstudio
  base_url: http://127.0.0.1:1234/v1
  # 中文推荐 text-embedding-bge-m3（1024 维）；轻量可用 nomic-embed-text-v1.5（768 维）
  # 云端示例（硅基流动）：model: BAAI/bge-m3, base_url: https://api.siliconflow.cn/v1
  model: text-embedding-bge-m3
  dim: 1024
  api_key: ""                # 云端需要；也可写 ${MEMORY_EMBEDDING_API_KEY} 从环境变量读
  ttl_seconds: 0             # 0 = 常驻不卸载（仅 lmstudio 有意义）
  batch_size: 16
  auto_load: true            # 仅 lmstudio：服务启动/模型被卸载时自动拉起
  timeout: 120

# ============ 记忆抽取模型 ============
# 每次对话后台调用，建议用便宜/本地的小模型，不要用昂贵的旗舰模型。
extract:
  provider: lmstudio
  base_url: http://127.0.0.1:1234/v1
  model: 你的抽取模型名  # 留空则由 setup.py 帮你选
  api_key: ""                # 也可写 ${MEMORY_EXTRACT_API_KEY}
  temperature: 0.2
  max_tokens: 3000           # reasoning 型模型需足够大，否则 JSON 还没输出就被截断
  auto_load: true
  ttl_seconds: 0
  timeout: 300

# ============ 检索参数 ============
retrieval:
  top_n: 5                   # 注入条数上限
  min_score: 0.5             # 绝对阈值（cosine），低于视为不相关
  cliff_ratio: 1.5           # 断崖检测：top1/top3 超过此比例则只取前 2-3 条
  keyword_boost: 0.15        # 关键词命中加分
  k_candidates: 30           # 候选数（top_n * 6）
  # 注入位配额：防止某一类记忆霸占全部注入位
  # （仅自动注入路径生效；指定 source 或 n 的定向查询保持纯相关度排序）
  #   profile   = preference / goal / decision / fact（用户是谁、要什么）
  #   content   = evidence / thesis（论点、论据）
  #   knowledge = 知识库文档
  quota:
    profile: 2
    content: 2
    knowledge: 1
  # 共享档：跨 bot 可见的一档记忆（用户画像 / 环境事实）。
  # 可见性三档 = 私有(project == 自己的 namespace) + 共享(project == shared_namespace) + 知识库。
  # 置空字符串即关闭共享，回到纯隔离。
  shared_namespace: shared
  # 注入时给共享档预留的条数（防止被 top_n 截断吃掉）
  shared_slots: 1
  # 分层召回门槛：profile 最容易被带上，fact/evidence 最难。
  #
  # 定这个梯度的依据（实测同一提问对全库的原始相似度）：
  #   category      无关提问     相关提问     区分度
  #   preference    0.51~0.54   0.68~0.79   ★★★ 强
  #   goal/decision 0.47~0.49   0.54~0.66     中
  #   thesis        0.43~0.46   0.50~0.61     中
  #   fact          0.50~0.52   0.55~0.59   ✗ 几乎无
  #   evidence      0.52~0.53   0.55~0.67   ✗ 弱
  #
  # fact/evidence 无关时也能到 0.52，相关时才 0.55 —— 区分度极小，
  # 所以门槛必须抬到 0.55 以上，否则无关提问照样硬塞
  # （实测「今晚吃什么」把「记住数字 7」召回了）。
  group_min:        # 分组默认门槛
    profile: 0.52
    content: 0.55
    knowledge: 0.45
  cat_min:          # 单类覆盖（优先级最高，未列的用组默认）
    preference: 0.55
    goal: 0.52
    decision: 0.52
    fact: 0.55
    thesis: 0.50
    evidence: 0.56

# ============ 语义去重 ============
# sim_threshold 需与 embedding 模型匹配：
#   bge-m3（区分度好）→ 0.95
#   nomic-embed-text    → 0.88（中文区分度较弱，阈值需放宽）
dedup:
  enabled: true
  sim_threshold: 0.95

# ============ 稳定性（仅 lmstudio 生效）============
stability:
  healthcheck_interval: 60   # 守护线程巡检间隔（秒）
  auto_load_retry: 3         # 加载失败重试次数
  retry_backoff: 5           # 退避基数（秒），指数增长
  keepalive_ttl: 0           # 保活 TTL；0 = 常驻

# ============ 抽取节奏 ============
extract_every_n_turns: 2

# ============ 队列积压告警 ============
# 防「worker 静默死亡」: 全症状皆无, 只是新记忆不再被抽取。
# 2026-10-05 曾发生 worker 死亡 24 小时、队列积压 18 条无人察觉
# (app.py 活得好好的, /api/health 一直假报 ok)。
# 判定: pending>=min_pending 且 队首等>=min_age_sec 且 running==0
#       running==0 是防误报 —— 有人在消化就不算故障。
queue_alert:
  enabled: true
  min_pending: 5             # 待处理条数达到多少条才考虑告警
  min_age_sec: 1800          # 且队首至少等这么久(单条正常耗时几十秒~几分钟)
  webhook: ""                # 飞书机器人 webhook; 留空则只打日志

# 抽取模式:
#   queue (默认/推荐) —— /api/extract 只入队立即返回(毫秒级), 由 worker.py
#                        独立进程消费。模型推理几分钟也不影响 pi。
#   sync             —— 旧行为, 在 HTTP 请求里同步抽取。会阻塞服务, 仅调试用。
extract:
  mode: queue     # 每 N 轮对话抽取一次（由前端扩展实现）
